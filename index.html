<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Digital Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: #2a2a3d;
      --accent: #7c5cfc;
      --accent2: #fc5c7d;
      --accent-glow: rgba(124,92,252,0.25);
      --text: #f0f0ff;
      --text-muted: #7a7a9a;
      --success: #4ade80;
      --gold: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background mesh */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(124,92,252,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(252,92,125,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .app { position: relative; z-index: 1; }

    /* Header */
    header {
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cart-btn {
      position: relative;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
    }
    .cart-btn:hover { background: var(--surface); border-color: var(--accent); }

    .cart-count {
      position: absolute;
      top: -6px; right: -6px;
      background: var(--accent2);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 10px;
      font-weight: 700;
      width: 18px; height: 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      display: none;
    }
    .cart-count.visible { display: flex; }

    /* Category tabs */
    .categories {
      display: flex;
      gap: 8px;
      padding: 20px 20px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-tab {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .cat-tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    /* Section title */
    .section-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 18px;
      padding: 20px 20px 12px;
      color: var(--text);
    }

    /* Products grid */
    .products {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 16px;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s;
      animation: fadeUp 0.4s ease both;
    }
    .product-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--accent-glow);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .product-card:nth-child(1) { animation-delay: 0.05s; }
    .product-card:nth-child(2) { animation-delay: 0.1s; }
    .product-card:nth-child(3) { animation-delay: 0.15s; }
    .product-card:nth-child(4) { animation-delay: 0.2s; }

    .product-thumb {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      background: var(--surface2);
    }

    .product-info { padding: 10px 12px 12px; }

    .product-name {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .product-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .product-price {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
    }

    .stock-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(74,222,128,0.12);
      color: var(--success);
      border: 1px solid rgba(74,222,128,0.25);
    }
    .stock-badge.low { background: rgba(251,191,36,0.12); color: var(--gold); border-color: rgba(251,191,36,0.25); }
    .stock-badge.out { background: rgba(252,92,125,0.1); color: var(--accent2); border-color: rgba(252,92,125,0.2); }

    /* Product detail modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .modal-icon { font-size: 52px; text-align: center; margin-bottom: 16px; }

    .modal-name {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-desc {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .modal-features {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .feature-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .modal-footer {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-price {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      flex: 1;
    }

    .add-cart-btn {
      background: linear-gradient(135deg, var(--accent), #9b7dff);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      flex: 2;
    }
    .add-cart-btn:hover { transform: scale(1.02); box-shadow: 0 4px 20px var(--accent-glow); }
    .add-cart-btn:active { transform: scale(0.98); }
    .add-cart-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Cart sheet */
    .cart-sheet {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .cart-sheet.open { opacity: 1; pointer-events: all; }

    .cart-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    .cart-sheet.open .cart-panel { transform: translateY(0); }

    .cart-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .cart-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    .close-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .close-btn:hover { color: var(--text); border-color: var(--accent); }

    .cart-items { overflow-y: auto; flex: 1; padding: 12px 20px; }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-item:last-child { border-bottom: none; }

    .cart-item-icon { font-size: 28px; flex-shrink: 0; }

    .cart-item-info { flex: 1; }
    .cart-item-name { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; }
    .cart-item-price { font-size: 12px; color: var(--accent); margin-top: 2px; }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 26px; height: 26px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .qty-btn:hover { background: var(--accent); border-color: var(--accent); }

    .qty-num {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      min-width: 20px;
      text-align: center;
    }

    /* Order form */
    .order-form { padding: 16px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }

    .form-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--text-muted); }

    .cart-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .total-label { color: var(--text-muted); font-size: 14px; }
    .total-amount {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .checkout-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .checkout-btn:hover { opacity: 0.9; transform: scale(1.01); }
    .checkout-btn:active { transform: scale(0.99); }

    /* Empty cart */
    .empty-cart {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty-cart-icon { font-size: 44px; margin-bottom: 12px; }
    .empty-cart p { font-size: 14px; }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 13px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      color: var(--text);
      z-index: 999;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Success screen */
    .success-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .success-screen.show { opacity: 1; pointer-events: all; }

    .success-icon {
      font-size: 72px;
      margin-bottom: 20px;
      animation: bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes bounceIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 10px;
    }

    .success-sub {
      color: var(--text-muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .back-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 32px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .back-btn:hover { border-color: var(--accent); }

    .order-id {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 16px;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Bottom padding */
    .bottom-pad { height: 32px; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">⚡ DigitalShop</div>
    <button class="cart-btn" onclick="openCart()">
      🛒
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <div class="categories">
    <button class="cat-tab active" onclick="filterCat('all', this)">Tất cả</button>
    <button class="cat-tab" onclick="filterCat('game', this)">🎮 Game</button>
    <button class="cat-tab" onclick="filterCat('streaming', this)">🎬 Streaming</button>
    <button class="cat-tab" onclick="filterCat('software', this)">💻 Software</button>
    <button class="cat-tab" onclick="filterCat('social', this)">📱 Social</button>
  </div>

  <div class="section-title">Sản phẩm nổi bật</div>

  <div class="products" id="productGrid"></div>
  <div class="bottom-pad"></div>
</div>

<!-- Product Modal -->
<div class="modal-overlay" id="productModal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-icon" id="mIcon"></div>
    <div class="modal-name" id="mName"></div>
    <div class="modal-desc" id="mDesc"></div>
    <div class="modal-features" id="mFeatures"></div>
    <div class="modal-footer">
      <div class="modal-price" id="mPrice"></div>
      <button class="add-cart-btn" id="mAddBtn" onclick="addToCart()">+ Thêm giỏ</button>
    </div>
  </div>
</div>

<!-- Cart Sheet -->
<div class="cart-sheet" id="cartSheet" onclick="closeCartSheet(event)">
  <div class="cart-panel">
    <div class="cart-header">
      <div class="cart-title">🛒 Giỏ hàng</div>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="order-form" id="orderForm">
      <input class="form-input" id="buyerName" placeholder="👤 Tên của bạn" />
      <input class="form-input" id="buyerContact" placeholder="📨 Telegram username hoặc SĐT" />
      <div class="cart-total">
        <span class="total-label">Tổng cộng</span>
        <span class="total-amount" id="cartTotal">0đ</span>
      </div>
      <button class="checkout-btn" onclick="placeOrder()">Đặt hàng ngay →</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Success -->
<div class="success-screen" id="successScreen">
  <div class="success-icon">🎉</div>
  <div class="success-title">Đặt hàng thành công!</div>
  <div class="order-id" id="orderId"></div>
  <div class="success-sub">Đơn hàng đã được gửi đến shop.<br>Bạn sẽ nhận được sản phẩm sớm nhất!</div>
  <button class="back-btn" onclick="backToShop()">← Tiếp tục mua sắm</button>
</div>

<script>
  // Telegram WebApp init
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#0a0a0f');
    tg.setBackgroundColor('#0a0a0f');
  }

  // ============= DỮ LIỆU SẢN PHẨM =============
  // 👉 Chỉnh sửa danh sách sản phẩm tại đây!
  const products = [
    {
      id: 1, cat: 'game',
      icon: '🎮', name: 'Steam Gift Card 100k',
      desc: 'Thẻ nạp Steam Wallet, giao tức thì qua Telegram.',
      features: ['Giao ngay', 'Bảo hành 24h', 'Không region lock'],
      price: 95000, stock: 'in' // 'in' | 'low' | 'out'
    },
    {
      id: 2, cat: 'streaming',
      icon: '🎬', name: 'Netflix Premium 1 tháng',
      desc: 'Tài khoản Netflix Premium 4K, chia sẻ 1 màn hình.',
      features: ['4K Ultra HD', '1 màn hình', 'Hỗ trợ 24/7'],
      price: 45000, stock: 'in'
    },
    {
      id: 3, cat: 'software',
      icon: '💻', name: 'Canva Pro 1 tháng',
      desc: 'Tài khoản Canva Pro đầy đủ tính năng thiết kế chuyên nghiệp.',
      features: ['Không giới hạn', 'Xóa nền', 'Premium assets'],
      price: 35000, stock: 'low'
    },
    {
      id: 4, cat: 'streaming',
      icon: '🎵', name: 'Spotify Premium 1 tháng',
      desc: 'Nghe nhạc không quảng cáo, tải offline toàn bộ.',
      features: ['Offline mode', 'HQ audio', 'Không quảng cáo'],
      price: 30000, stock: 'in'
    },
    {
      id: 5, cat: 'social',
      icon: '📸', name: 'Instagram Follow x1000',
      desc: 'Tăng 1000 follow Instagram thật, không ảo.',
      features: ['Follow thật', 'Không drop', 'Bắt đầu 24h'],
      price: 80000, stock: 'in'
    },
    {
      id: 6, cat: 'game',
      icon: '🃏', name: 'Garena Shell 100',
      desc: 'Nạp 100 Shell Garena cho tài khoản của bạn.',
      features: ['Giao trong 5 phút', 'Mọi server', 'Bảo hành'],
      price: 22000, stock: 'out'
    },
    {
      id: 7, cat: 'software',
      icon: '🤖', name: 'ChatGPT Plus 1 tháng',
      desc: 'Truy cập GPT-4o, DALL·E, tốc độ ưu tiên.',
      features: ['GPT-4o', 'DALL·E 3', 'Tốc độ cao'],
      price: 480000, stock: 'low'
    },
    {
      id: 8, cat: 'social',
      icon: '▶️', name: 'YouTube 1000 View',
      desc: 'Tăng 1000 lượt xem YouTube cho video của bạn.',
      features: ['View giữ lại', 'An toàn', 'Bắt đầu nhanh'],
      price: 50000, stock: 'in'
    },
  ];
  // =============================================

  let cart = [];
  let selectedProduct = null;

  function formatPrice(n) {
    return n.toLocaleString('vi-VN') + 'đ';
  }

  function stockLabel(s) {
    if (s === 'in') return { cls: '', text: 'Còn hàng' };
    if (s === 'low') return { cls: 'low', text: 'Gần hết' };
    return { cls: 'out', text: 'Hết hàng' };
  }

  function renderProducts(list) {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = list.map((p, i) => {
      const s = stockLabel(p.stock);
      return `
        <div class="product-card" style="animation-delay:${i*0.05}s" onclick="openProduct(${p.id})">
          <div class="product-thumb">${p.icon}</div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-desc">${p.desc.substring(0, 40)}...</div>
            <div class="product-footer">
              <div class="product-price">${formatPrice(p.price)}</div>
              <div class="stock-badge ${s.cls}">${s.text}</div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function filterCat(cat, el) {
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    const filtered = cat === 'all' ? products : products.filter(p => p.cat === cat);
    renderProducts(filtered);
  }

  function openProduct(id) {
    selectedProduct = products.find(p => p.id === id);
    if (!selectedProduct) return;
    document.getElementById('mIcon').textContent = selectedProduct.icon;
    document.getElementById('mName').textContent = selectedProduct.name;
    document.getElementById('mDesc').textContent = selectedProduct.desc;
    document.getElementById('mPrice').textContent = formatPrice(selectedProduct.price);
    document.getElementById('mFeatures').innerHTML = selectedProduct.features.map(f => `<span class="feature-tag">✓ ${f}</span>`).join('');
    const btn = document.getElementById('mAddBtn');
    if (selectedProduct.stock === 'out') {
      btn.disabled = true; btn.textContent = 'Hết hàng';
    } else {
      btn.disabled = false; btn.textContent = '+ Thêm giỏ';
    }
    document.getElementById('productModal').classList.add('open');
  }

  function closeModal(e) {
    if (e.target.id === 'productModal') document.getElementById('productModal').classList.remove('open');
  }

  function addToCart() {
    if (!selectedProduct || selectedProduct.stock === 'out') return;
    const existing = cart.find(i => i.id === selectedProduct.id);
    if (existing) existing.qty++;
    else cart.push({ ...selectedProduct, qty: 1 });
    updateCartCount();
    document.getElementById('productModal').classList.remove('open');
    showToast(`✓ Đã thêm "${selectedProduct.name}"`);
    if (tg) tg.HapticFeedback?.impactOccurred('light');
  }

  function updateCartCount() {
    const total = cart.reduce((s, i) => s + i.qty, 0);
    const el = document.getElementById('cartCount');
    el.textContent = total;
    el.classList.toggle('visible', total > 0);
  }

  function openCart() {
    renderCartItems();
    document.getElementById('cartSheet').classList.add('open');
  }

  function closeCart() {
    document.getElementById('cartSheet').classList.remove('open');
  }

  function closeCartSheet(e) {
    if (e.target.id === 'cartSheet') closeCart();
  }

  function renderCartItems() {
    const container = document.getElementById('cartItems');
    const form = document.getElementById('orderForm');
    if (cart.length === 0) {
      container.innerHTML = `<div class="empty-cart"><div class="empty-cart-icon">🛒</div><p>Giỏ hàng đang trống</p></div>`;
      form.style.display = 'none';
    } else {
      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-icon">${item.icon}</div>
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">${formatPrice(item.price)}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
            <div class="qty-num">${item.qty}</div>
            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        </div>`).join('');
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      document.getElementById('cartTotal').textContent = formatPrice(total);
      form.style.display = 'block';
    }
  }

  function changeQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
    updateCartCount();
    renderCartItems();
  }

  function placeOrder() {
    const name = document.getElementById('buyerName').value.trim();
    const contact = document.getElementById('buyerContact').value.trim();
    if (!name || !contact) { showToast('⚠️ Vui lòng điền đầy đủ thông tin'); return; }
    if (cart.length === 0) { showToast('⚠️ Giỏ hàng trống'); return; }

    const orderId = 'DH' + Date.now().toString().slice(-7);
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

    // Gửi dữ liệu qua Telegram WebApp
    const orderData = {
      orderId,
      name,
      contact,
      items: cart.map(i => ({ name: i.name, qty: i.qty, price: i.price })),
      total,
      time: new Date().toLocaleString('vi-VN')
    };

    if (tg) {
      tg.sendData(JSON.stringify(orderData));
    }

    // Hiển thị thành công
    closeCart();
    document.getElementById('orderId').textContent = `Mã đơn: ${orderId}`;
    document.getElementById('successScreen').classList.add('show');
    cart = [];
    updateCartCount();
  }

  function backToShop() {
    document.getElementById('successScreen').classList.remove('show');
    document.getElementById('buyerName').value = '';
    document.getElementById('buyerContact').value = '';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Init
  renderProducts(products);
</script>
</body>
</html>
